# TaxRock document builder
# Static page in /public, gated by Netlify Identity (invite only).

[build]
  publish = "public"
  # there is no site to compile; this only installs the function's dependency
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Identity handles auth. The only server code is netlify/functions/quotes.mjs,
# which stores saved quotes in Netlify Blobs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"
